<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Khảo sát – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"></head><body data-p="survey"><main><h2><i class="fas fa-clipboard-list ic"></i>Khảo sát hướng đi</h2><p class="soft" id="intro">Các câu hỏi nhanh, mỗi lần một câu. Không có đáp án đúng hay sai, bạn cứ chọn theo cảm nhận của mình.</p><div id="wz" aria-live="polite"></div><div id="result" hidden></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>onData(()=>{
const IC=["face-frown","face-meh","face-grin-stars"];
let a=Q.map(()=>null),step=0,s=[],lock=false;
function wz(){const n=Q.length,w=$("#wz");
 if(step<n)w.innerHTML=`<div class="prog"><div class="bar"><b style="width:${step/n*100}%"></b></div><span>${step+1}/${n}</span></div><div class="card qcard"><span class="qic" style="--gc:${GC[Q[step][0]]}"><i class="fas fa-${GI[Q[step][0]]}"></i></span><h3 class="qt">${Q[step][1]}</h3><div class="anss">${LV.map((l,j)=>`<button class="ans ${a[step]===j?"on":""}" data-v="${j}"><i class="fas fa-${IC[j]}"></i>${l}</button>`).join("")}</div></div><div class="nav2"><button class="btn alt" id="bk" ${step?"":"disabled"}><i class="fas fa-arrow-left ic"></i>Quay lại</button></div>`;
 else w.innerHTML=`<div class="prog"><div class="bar"><b style="width:100%"></b></div><span>Câu cuối</span></div><div class="card qcard"><span class="qic"><i class="fas fa-book-open"></i></span><h3 class="qt">Bạn học tốt hoặc thấy hứng thú nhất với môn nào?</h3><p class="soft" style="margin-top:-8px">Chọn tối đa 3 môn</p><div class="opts" id="subs" style="justify-content:center">${SUB.map(x=>`<label class="opt sub"><input type="checkbox" value="${x}" ${s.includes(x)?"checked":""}><span>${x}</span></label>`).join("")}</div><p class="msg" id="msg" role="alert"></p></div><div class="nav2"><button class="btn alt" id="bk"><i class="fas fa-arrow-left ic"></i>Quay lại</button><button class="btn" id="go">Xem gợi ý<i class="fas fa-arrow-right" style="margin-left:7px"></i></button></div>`;
 const t=$(".qt");t.tabIndex=-1;t.focus({preventScroll:true})}
$("#wz").addEventListener("click",e=>{const b=e.target.closest(".ans");
 if(b&&!lock){lock=true;a[step]=+b.dataset.v;$$(".ans").forEach(x=>x.classList.toggle("on",x===b));setTimeout(()=>{lock=false;step++;wz()},220);return}
 if(e.target.closest("#bk")&&step>0&&!lock){step--;wz();return}
 if(e.target.closest("#go")){if(!s.length){$("#msg").textContent="Hãy chọn ít nhất 1 môn.";return}const d={a,s};store.set(KEY,d);res(d)}});
$("#wz").addEventListener("change",e=>{if(e.target.type!=="checkbox")return;
 if($$("#subs input:checked").length>3){e.target.checked=false;$("#msg").textContent="Chỉ chọn tối đa 3 môn.";return}
 s=$$("#subs input:checked").map(x=>x.value);$("#msg").textContent=""});
function res(d){const{gs,list,mx}=calc(d);$("#wz").hidden=true;$("#intro").hidden=true;$("#result").hidden=false;
 $("#result").innerHTML=`<p class="soft">Đây là gợi ý để tham khảo, bạn hoàn toàn có thể chọn khác. Chạm vào từng nghề để xem chi tiết.</p><div class="card" style="margin:14px 0 24px"><h3><i class="fas fa-chart-simple ic"></i>Nhóm nghề bạn nghiêng về</h3>${Object.entries(gs).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div><i class="fas fa-${GI[k]} ic" style="color:${GC[k]}"></i>${G[k]}<div class="bar"><b style="width:${v/mx*100}%;background:${GC[k]}"></b></div></div>`).join("")}</div>
 ${list.slice(0,3).map((t,n)=>`<button class="card cbtn" data-pop="${t.i}" data-s="${d.s.join('|')}"><span class="no" style="--gc:${GC[t.c[1]]}">${n+1}</span><span class="cb"><span>${t.c[0]}</span><small><i class="fas fa-${GI[t.c[1]]} ic"></i>${G[t.c[1]]}. Mức hợp ${t.pct}%</small><span class="bar"><b style="width:${t.pct}%;background:${GC[t.c[1]]}"></b></span></span><i class="fas fa-chevron-right"></i></button>`).join("")}
 <div class="row"><a class="btn" href="so-sanh.html"><i class="fas fa-scale-balanced ic"></i>Sang bước So sánh</a><button class="btn alt" id="redo"><i class="fas fa-rotate-left ic"></i>Làm lại khảo sát</button></div>`;
 $("#redo").onclick=()=>{store.set(KEY,null);a=Q.map(()=>null);step=0;s=[];$("#result").hidden=true;$("#wz").hidden=false;$("#intro").hidden=false;wz();scrollTo(0,0)};scrollTo(0,0)}
const sv=store.get(KEY,null);
// Nếu admin đã đổi số câu hỏi sau khi bạn làm khảo sát, kết quả cũ không còn khớp nên làm lại
if(sv&&sv.a&&sv.a.length===Q.length){a=sv.a;s=sv.s.filter(x=>SUB.includes(x));res({a,s})}else{if(sv)store.set(KEY,null);wz()}
});</script></body></html>
