<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kế hoạch – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"></head><body data-p="plan"><main><h2>Kế hoạch của mình</h2><p class="soft">Ghi lại phương án chính, phương án dự phòng và các mốc cần làm. Mọi thứ tự lưu trên máy này.</p>
<div class="grid"><div class="card"><h3>Phương án chính</h3><select id="main" aria-label="Phương án chính"></select><div id="mainInfo"></div></div>
<div class="card"><h3>Phương án dự phòng</h3><select id="backup" aria-label="Phương án dự phòng"></select><div id="backInfo"></div></div></div>
<div class="card" style="margin-top:18px"><h3>Trường và ghi chú</h3><p><label>Trường THPT hoặc trường nghề mục tiêu<br><input type="text" id="school" style="width:100%"></label></p><p><label>Ghi chú về điều kiện, suy nghĩ của mình<br><textarea id="notes"></textarea></label></p></div>
<div class="card" style="margin-top:18px"><h3>Việc cần làm</h3><div id="todo"></div></div>
<div class="row"><button class="btn" onclick="print()"><i class="fas fa-print ic"></i>In hoặc lưu thành PDF</button><span class="soft" id="saved"></span></div></main><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>
const P=store.get(PLAN,{}),O=`<option value="">Chưa chọn</option>`+C.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("")+`<option value="gdtx">Học giáo dục thường xuyên</option><option value="nghe">Học trường nghề</option>`;
const ex={gdtx:"Học văn hóa linh hoạt, có thể kết hợp học nghề.",nghe:"Học nghề sớm, ra đi làm nhanh, vẫn có thể học liên thông."};
function info(v,el){const x=$(el);x.innerHTML=v===undefined||v===""?"":(C[v]?`<p>${C[v][2]}</p>${chips(C[v][3].split("|"))}`:`<p>${ex[v]||""}</p>`)}
function save(){store.set(PLAN,P);$("#saved").textContent="Đã lưu";}
["main","backup"].forEach(k=>{const s=$("#"+k);s.innerHTML=O;s.value=P[k]===undefined?"":P[k];info(s.value,k==="main"?"#mainInfo":"#backInfo");
 s.onchange=()=>{P[k]=C[s.value]?+s.value:s.value;info(s.value,k==="main"?"#mainInfo":"#backInfo");save()}});
$("#school").value=P.school||"";$("#notes").value=P.notes||"";
$("#school").oninput=e=>{P.school=e.target.value;save()};$("#notes").oninput=e=>{P.notes=e.target.value;save()};
P.todo=P.todo||{};
$("#todo").innerHTML=TODO.map((t,i)=>`<div class="chk" style="flex-wrap:wrap"><input type="checkbox" id="t${i}" data-i="${i}" ${(P.todo[i]||{}).d?"checked":""}><label for="t${i}" style="flex:1;min-width:200px">${t}</label><input type="date" data-dt="${i}" value="${(P.todo[i]||{}).dt||""}" aria-label="Hạn cho việc ${i+1}"></div>`).join("");
$("#todo").onchange=e=>{const i=e.target.dataset.i??e.target.dataset.dt;P.todo[i]=P.todo[i]||{};if(e.target.dataset.i!==undefined)P.todo[i].d=e.target.checked;else P.todo[i].dt=e.target.value;save()};
</script></body></html>
