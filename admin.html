<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Quản trị – Ngã Rẽ 10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/admin.css"></head>
<body>
<main>
<div id="login" class="card lg" hidden>
  <h2><i class="fas fa-lock ic"></i>Đăng nhập quản trị</h2>
  <p class="soft">Chỉ tài khoản quản trị mới sửa được dữ liệu. Học sinh vẫn xem trang bình thường.</p>
  <form id="lf"><label>Email<br><input type="text" id="em" autocomplete="username" inputmode="email" required></label><br><br>
  <label>Mật khẩu<br><input type="password" id="pw" autocomplete="current-password" required></label>
  <p class="msg" id="lmsg" role="alert"></p><button class="btn" id="lgo">Đăng nhập</button></form>
</div>

<div id="app" hidden>
  <div class="abar"><div><b>Quản trị Ngã Rẽ 10</b> <span class="soft" id="who"></span></div>
    <div class="row" style="margin:0;align-items:center"><span id="dirty" class="dirty" hidden>Chưa lưu</span><a class="btn alt sm" href="index.html" target="_blank" rel="noopener">Xem trang học sinh</a><button class="btn sm" id="save"><i class="fas fa-cloud-arrow-up ic"></i>Lưu lên Firestore</button><button class="btn alt sm" id="out">Đăng xuất</button></div></div>
  <div class="note" id="newnote" hidden>Firestore chưa có dữ liệu nên đang hiển thị dữ liệu mẫu. Bấm <b>Lưu lên Firestore</b> để tạo dữ liệu đầu tiên.</div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="pane"></div>
</div>
<p class="msg" id="gmsg" role="alert"></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/admin.js"></script>
</body></html>
